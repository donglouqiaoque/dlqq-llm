# ===================================================================
#  chat_demo · 最小可跑的对话 demo
#
#  语料：src\chat_demo\chat_demo.jsonl —— 30 条人工智能发展史问答（约 13 KB），
#        仓库自带，不用下载。
#  模型：4 层 / 4 头 / 128 维 · 约 0.9 M 参数 · 3,000 步 · 单卡几十秒。
#  用法：双击 script\train.bat 选这个文件；训练完双击 script\chat.bat 就能对话。
#
#  它的用途是跑通「语料 → 训练 → 对话 → 接进 DSH」整条链路。
#  语料只有几千 token，模型基本是把这些问答背下来，不要指望泛化。
# ===================================================================

# ---- 语料与输出 ----------------------------------------------------
# 语料目录：里面放 jsonl（每行 {"input": 问题, "target": 回答}）
data_path=src/chat_demo
# 模型名（不用写 .pt，自动存到 model\<名字>\<名字>.pt）
model=chat_demo
# 切词缓存（.ai_res 是临时目录，不进版本库）
cache_dir=.ai_res/cache

# ---- 对话 ----------------------------------------------------------
# 加载模型时读取；改完不用重训，优先级：命令行 > 本文件 > 模型文件里存的 > 默认值
chat_mode=true
chat_temperature=0.8
chat_top_k=40
# 回答平均 137 字、最长 627 字；300 覆盖 29/30 条，最长那条会被截断
chat_max_new=300

# ---- 模型结构 ------------------------------------------------------
# 语料只有约 4,800 token，small 档足够背下来，再大只是多占显存
n_layer=4
n_head=4
n_embd=128
# 128 字装得下一问一答；古诗那种长句才需要 256
block_size=128
batch_size=32

# ---- 训练 ----------------------------------------------------------
# 每步 32 × 128 = 4,096 token；3,000 步 ≈ 1,230 万 token ≈ 语料 2,500 轮
max_iters=3000
eval_interval=200
eval_iters=20
lr=0.0003
weight_decay=0.1
grad_clip=1.0
dropout=0.1
seed=1337

# ---- 长训练选项（这个规模用不到，保持默认即可）----------------------
grad_accum=1
warmup_iters=100
lr_decay=cosine
min_lr_frac=0.1
grad_checkpoint=false
save_every=1000

# ---- 存档体积 ------------------------------------------------------
# fp16 权重 + 不存优化器：约 1.8 MB，方便直接发到模型仓库
save_dtype=fp16
save_optimizer=false

# ---- 词表 ----------------------------------------------------------
# 实际只有 754 个不重复字符，8,000 的上限不会触发截断
max_vocab=8000
# 验证集取 5%（约 240 token）；再小会不足 block_size，脚本会强行缩上下文
val_frac=0.05

# ---- 运行环境 ------------------------------------------------------
# python 解释器：留空 = 用 PATH 上的 python；要固定就写 python.exe 的绝对路径
# python=C:\Python312\python.exe
python=

# 开始前要不要再确认一次：no = 选完直接开始
confirm=no
