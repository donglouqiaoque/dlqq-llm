# ===================================================================
#  训练配置：演示语料 chat_demo（小模型，约 20 秒跑完）
#
#  用法：双击 script\train.bat，按编号选这个文件，回车确认即可。
#  所有参数都在这个文件里，改完保存就生效，不需要动代码。
# ===================================================================

# ---- 语料与输出 ----------------------------------------------------
# 语料路径（相对工程根目录；txt 和 jsonl 都支持，格式自动判断）
data_path=src/chat_demo.txt
# 模型名（不用写 .pt，会保存到 model\ 目录）
model=chat_demo
# 切词缓存放哪（临时文件统一放 ai_res）
cache_dir=ai_res/cache

# ---- 模型结构（small 档，约 0.9 M 参数）----------------------------
n_layer=4
n_head=4
n_embd=128
block_size=128
batch_size=32

# ---- 训练 ----------------------------------------------------------
max_iters=3000
eval_interval=200
lr=0.0003
dropout=0.1
weight_decay=0.1
grad_clip=1.0
seed=1337

# ---- 词表 ----------------------------------------------------------
max_vocab=8000
val_frac=0.05

# ---- 运行环境 ------------------------------------------------------
# python 解释器：留空 = 用 PATH 上的 python；
# 想固定环境就写绝对路径，例如：
# python=D:\Soft\Python\Python3_13_9\python.exe
python=

# 开始前要不要再确认一次：no = 选完直接开始（推荐），yes = 再问一次
confirm=no
