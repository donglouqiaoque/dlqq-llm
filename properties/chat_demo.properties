# ===================================================================
#  训练配置：演示语料 chat_demo（考题库，几分钟跑完）
#
#  语料来源（README 里要标注）：
#    魔搭上的 C-Eval / gaokao-benchmark / 高考生物 —— 公开考题数据集
#  这份语料把题目全部用于训练，所以模型是「记住」这些题的，
#  只能当演示，不能拿同一批题报 benchmark 分数。
#
#  准备语料：script\fetch_chat_demo.bat
#  然后：双击 script\train.bat，按编号选这个文件即可。
# ===================================================================

# ---- 语料与输出 ----------------------------------------------------
# 语料目录：里面放 jsonl（每行 {"input": 题目+选项, "target": 答案}）
data_path=src/chat_demo
# 模型名（不用写 .pt，会保存到 model\ 目录）
model=chat_demo
# 切词缓存放哪（临时文件统一放 ai_res）
cache_dir=ai_res/cache

# ---- 模型结构（medium 档，约 13.7 M 参数；fp16 存盘约 27 MB）-------
n_layer=6
n_head=6
n_embd=384
block_size=256
batch_size=32

# ---- 训练 ----------------------------------------------------------
# 题库约 1.5 M token，3000 步 ≈ 十几个 epoch，会背下来（demo 要的就是这效果）
max_iters=3000
eval_interval=200
eval_iters=20
lr=0.0005
weight_decay=0.1
grad_clip=1.0
dropout=0.1
seed=1337

# ---- 长训练选项（这里用不到，保持默认）----
grad_accum=1
warmup_iters=100
lr_decay=cosine
min_lr_frac=0.1
grad_checkpoint=false
resume=false
save_every=1000

# ---- 体积：半精度 + 不存优化器，压到 Gitee 单文件 50 MB 以内 ----
save_dtype=fp16
save_optimizer=false

# ---- 词表 ----------------------------------------------------------
max_vocab=8000
val_frac=0.02

# ---- 运行环境 ------------------------------------------------------
# python 解释器：留空 = 用 PATH 上的 python
python=

# 开始前要不要再确认一次：no = 选完直接开始
confirm=no
