# ===================================================================
#  dlqq_llm · 通用中文对话（GB 级语料，large 档）
#
#  语料：src\dlqq_llm\ —— 75 个 jsonl / 15.6 GB / 约 55 亿字符（字符级模型，1 字 = 1 token）
#          firefly-train-1.1M.jsonl        问答，1.2 GB（约 4 亿字符）
#          pretrain-mix-000~062.jsonl      网页+新闻+维基+百科，12.6 GB（约 45 亿字符）
#          pretrain-wiki-000~010.jsonl     中文维基正文，1.9 GB（约 6.8 亿字符）
#        语料不进版本库，需自备（清洗/下载脚本见 AIRES.md）。
#  模型：8 层 / 8 头 / 512 维 · 约 33 M 参数（词表 12,000）
#  用法：双击 script\train\train.bat 选这个文件；训练完 script\chat\stdio\chat.bat dlqq_llm。
# ===================================================================

# ---- 语料与输出 ----------------------------------------------------
# 语料目录；目录里的问答 jsonl 会拼成「用户：…／助手：…」，{"text": …} 当纯文本
data_path=src/dlqq_llm
# 模型名（不用写 .pt，自动存到 model\dlqq_llm\dlqq_llm.pt）
model=dlqq_llm
# 切词缓存（.ai_res 是临时目录，不进版本库；第一次切 15.6 GB 约 16 分钟，之后复用）
cache_dir=.ai_res/cache

# ---- 对话 ----------------------------------------------------------
# 加载模型时读取；改完不用重训，优先级：命令行 > 本文件 > 模型文件里存的 > 默认值
chat_mode=true
chat_temperature=0.8
chat_top_k=40
chat_max_new=180

# ---- 模型结构 ------------------------------------------------------
# large 档；8 GB 显存的上限附近，再大就要开 grad_accum 或 grad_checkpoint
n_layer=8
n_head=8
n_embd=512
block_size=256
batch_size=32

# ---- 训练 ----------------------------------------------------------
# 每步 32 × 256 = 8,192 token；150,000 步 ≈ 12.3 亿 token ≈ 语料 22%（8 GB 显存约 8 小时）
# 参考：80,000 步 ≈ 计算最优（33 M 参数 × 20 token/参数）；
#       676,000 步 = 跑满一轮（约 37 小时）；只是试跑改成 5,000
max_iters=150000
# 每 100 步评估并打日志（约 20 秒一行），别设太大，否则长时间看不到进度
eval_interval=100
eval_iters=50
lr=0.0003
weight_decay=0.1
grad_clip=1.0
# 语料已经远多于参数（55 亿 token / 33 M 参数），dropout 调小一点，让模型多吃数据
dropout=0.05
seed=1337

# ---- 长训练选项 ----------------------------------------------------
# 显存不够时把 grad_accum 调到 2~4，用等效 batch 换显存
grad_accum=1
# 15 万步的长训练，前 1,000 步线性预热，避免一开始 lr 过大把权重带偏
warmup_iters=1000
lr_decay=cosine
min_lr_frac=0.1
# 省显存模式：慢 20~30%，batch / block 调不下来时再开
grad_checkpoint=false
# 长训练每 2,000 步存一次盘，避免跑了几小时中断却白跑
save_every=2000

# ---- 存档体积 ------------------------------------------------------
# fp32 + 存优化器 ≈ 380 MB；只想发权重可以改 fp16 + false（约 130 MB）
save_dtype=fp32
save_optimizer=true

# ---- 词表 ----------------------------------------------------------
# 8,600 万字符的抽样里出现 15,228 个不同字符（简繁混排），top 12,000 已覆盖 99.995%，
# 再往上加只是给生僻字留位置，收益很小
max_vocab=12000
# 从语料尾部切 0.5% 做验证集，约 2,700 万字符；5% 会到 2.7 亿，没必要
val_frac=0.005

# ---- 运行环境 ------------------------------------------------------
# python 解释器：留空 = 用 PATH 上的 python；要固定就写 python.exe 的绝对路径
# python=C:\Python312\python.exe
python=

# 开始前要不要再确认一次：no = 选完直接开始
confirm=no
