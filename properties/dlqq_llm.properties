# ===================================================================
#  dlqq_llm · 通用中文对话（GB 级语料，large 档）
#
#  语料：src\dlqq_llm\ —— 目录，可放任意多个 .jsonl / .txt，训练时按文件名排序合并。
#        语料不进版本库。推荐组合：
#          firefly-train-1.1M.jsonl    问答，约 1.17 GB / 165 万条
#          pretrain-mix-000~009.jsonl  纯文本，约 2 GB
#        合计约 3.2 GB / 11 亿 token。想先从 2 GB 起步：
#          .ai_res\script\fetch_pretrain_corpus.bat --max-mb 2000
#  模型：8 层 / 8 头 / 512 维 · 约 29.4 M 参数 · 60,000 步 · 8 GB 显存约 3.3 小时。
#  用法：双击 script\train.bat 选这个文件；训练完 script\chat.bat dlqq_llm。
# ===================================================================

# ---- 语料与输出 ----------------------------------------------------
# 语料目录；目录里的问答 jsonl 会拼成「用户：…／助手：…」，{"text": …} 当纯文本
data_path=src/dlqq_llm
# 模型名（不用写 .pt，自动存到 model\dlqq_llm\dlqq_llm.pt）
model=dlqq_llm
# 切词缓存（.ai_res 是临时目录，不进版本库；第一次切 3.2 GB 约 3 分钟，之后复用）
cache_dir=.ai_res/cache

# ---- 对话 ----------------------------------------------------------
# 加载模型时读取；改完不用重训，优先级：命令行 > 本文件 > 模型文件里存的 > 默认值
chat_mode=true
chat_temperature=0.8
chat_top_k=40
chat_max_new=180

# ---- 模型结构 ------------------------------------------------------
# large 档；8 GB 显存的上限附近，再大就要开 grad_accum 或 grad_checkpoint
n_layer=8
n_head=8
n_embd=512
block_size=256
batch_size=32

# ---- 训练 ----------------------------------------------------------
# 每步 32 × 256 = 8,192 token；60,000 步 ≈ 4.9 亿 token ≈ 语料 0.45 轮（8 GB 显存约 3.3 小时）
# 想跑满一轮改成 135,000（约 7.5 小时）；只是试跑改成 5,000
max_iters=60000
# 每 100 步评估并打日志（约 20 秒一行），别设太大，否则长时间看不到进度
eval_interval=100
eval_iters=50
lr=0.0003
weight_decay=0.1
grad_clip=1.0
dropout=0.1
seed=1337

# ---- 长训练选项 ----------------------------------------------------
# 显存不够时把 grad_accum 调到 2~4，用等效 batch 换显存
grad_accum=1
# 长训练建议 1000~2000 步预热；这里保持 0（不预热）
warmup_iters=0
lr_decay=cosine
min_lr_frac=0.1
# 省显存模式：慢 20~30%，batch / block 调不下来时再开
grad_checkpoint=false
# 断点续训：true = 有存档就接着训（恢复权重、优化器、步数和学习率进度）；
# 第一次跑没有存档时会自动从头开始。想强制重训就改成 false。
resume=true
# 0 = 只在验证损失变好时存档；长训练可以设 1000，避免中途丢了进度
save_every=0

# ---- 存档体积 ------------------------------------------------------
# fp32 + 存优化器 ≈ 337 MB；只想发权重可以改 fp16 + false（约 118 MB）
save_dtype=fp32
save_optimizer=true

# ---- 词表 ----------------------------------------------------------
# 汉字和符号远多于 8,000，这里只保留最常用的 8,000 个，其余丢弃（实测丢弃 0.03%）
max_vocab=8000
# 从语料尾部切 5% 做验证集（约 5,700 万 token）
val_frac=0.05

# ---- 运行环境 ------------------------------------------------------
# python 解释器：留空 = 用 PATH 上的 python；要固定就写 python.exe 的绝对路径
# python=C:\Python312\python.exe
python=

# 开始前要不要再确认一次：no = 选完直接开始
confirm=no
