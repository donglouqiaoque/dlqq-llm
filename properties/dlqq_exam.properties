# ===================================================================
#  dlqq_exam · 考题库 demo（C-Eval / gaokao-benchmark / 高考生物）
#
#  语料：src\dlqq_exam\dlqq_exam.jsonl —— 4,562 条（题目 + 答案 + 解析，约 5.5 MB）。
#        语料不进版本库，用 script\fetch_chat_demo.bat 从魔搭下载生成。
#  模型：6 层 / 6 头 / 384 维 · 约 13.7 M 参数 · 3,000 步 · 8 GB 显存几分钟。
#  用法：双击 script\train.bat 选这个文件；训练完 script\chat.bat dlqq_exam。
#
#  注意：题库全部用于训练，模型是「记住」这些题，不能拿同一批题报 benchmark；
#        语料含 C-Eval（CC BY-NC-SA 4.0，非商业），不要随仓库公开分发。
# ===================================================================

# ---- 语料与输出 ----------------------------------------------------
# 语料目录：里面放 jsonl（每行 {"input": 题目+选项, "target": 答案}）
data_path=src/dlqq_exam
# 模型名（不用写 .pt，自动存到 model\dlqq_exam\dlqq_exam.pt）
model=dlqq_exam
# 切词缓存（.ai_res 是临时目录，不进版本库）
cache_dir=.ai_res/cache

# ---- 对话 ----------------------------------------------------------
# 加载模型时读取；改完不用重训，优先级：命令行 > 本文件 > 模型文件里存的 > 默认值
chat_mode=true
chat_temperature=0.8
chat_top_k=40
# 答案多为「选项 + 解析」，180 字足够；要完整解析就调大
chat_max_new=180

# ---- 模型结构 ------------------------------------------------------
# 语料约 270 万 token，medium 档（13.7 M）够用，再大只会更慢
n_layer=6
n_head=6
n_embd=384
# 解析通常一两百字，256 字上下文能覆盖绝大多数题目
block_size=256
batch_size=32

# ---- 训练 ----------------------------------------------------------
# 每步 32 × 256 = 8,192 token；3,000 步 ≈ 2,460 万 token ≈ 语料 9 轮，够背下来
max_iters=3000
eval_interval=200
eval_iters=20
lr=0.0005
weight_decay=0.1
grad_clip=1.0
dropout=0.1
seed=1337

# ---- 长训练选项（这个规模用不到，保持默认即可）----------------------
grad_accum=1
warmup_iters=100
lr_decay=cosine
min_lr_frac=0.1
grad_checkpoint=false
resume=false
save_every=1000

# ---- 存档体积 ------------------------------------------------------
# fp16 权重 + 不存优化器：约 27 MB，能塞进 Gitee 单文件 50 MB 的限制
save_dtype=fp16
save_optimizer=false

# ---- 词表 ----------------------------------------------------------
# 实际 4,773 个不重复字符，8,000 的上限不会触发截断
max_vocab=8000
val_frac=0.02

# ---- 运行环境 ------------------------------------------------------
# python 解释器：留空 = 用 PATH 上的 python；要固定就写 python.exe 的绝对路径
# python=C:\Python312\python.exe
python=

# 开始前要不要再确认一次：no = 选完直接开始
confirm=no
